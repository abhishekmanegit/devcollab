spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devcollab}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Override in production, e.g. JWT_SECRET=$(openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET:devcollab-local-dev-secret-change-me-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://devcollab-bice.vercel.app}

app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:3MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:3MB}